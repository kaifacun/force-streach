name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v$v"; exit 1; }
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/force-stretch.exe dist/force-stretch.exe
      - uses: actions/upload-artifact@v4
        with:
          name: force-stretch-windows
          path: dist/force-stretch.exe
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          awk -v ver="${GITHUB_REF_NAME#v}" '/^\[[^]]*\]: /{exit} /^## /{p = index($0, "[" ver "]") > 0; next} p' CHANGELOG.md > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/force-stretch.exe
          body_path: dist/RELEASE_NOTES.md

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v$v"; exit 1; }
      - name: Test
        run: cargo test --release
      - name: Build app bundle
        run: ./bundle.sh
      - name: Package
        run: |
          mkdir -p dist
          cd target
          ditto -c -k --keepParent "Force Stretch.app" ../dist/Force-Stretch-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: force-stretch-macos
          path: dist/Force-Stretch-macos.zip
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          awk -v ver="${GITHUB_REF_NAME#v}" '/^\[[^]]*\]: /{exit} /^## /{p = index($0, "[" ver "]") > 0; next} p' CHANGELOG.md > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Force-Stretch-macos.zip
          body_path: dist/RELEASE_NOTES.md
